<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <title>سلة المشتريات</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
    }
    .cart-container {
      width: 400px;
      margin: 40px auto;
      background: #fff;
      padding: 20px;
      border-radius: 8px;
    }
    .cart-item {
      display: flex;
      justify-content: space-between;
      margin-bottom: 15px;
      border-bottom: 1px solid #ddd;
      padding-bottom: 10px;
    }
    .cart-item h4 {
      margin: 0;
    }
    .cart-total {
      text-align: center;
      font-weight: bold;
      margin-top: 20px;
    }
    button {
      width: 100%;
      padding: 10px;
      background: #0d6efd;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="cart-container">
    <h2>سلة المشتريات</h2>

    <div class="cart-item">
      <div>
        <h4>اسم المنتج</h4>
        <p>الكمية: 2</p>
      </div>
      <span>40$</span>
    </div>

    <div class="cart-item">
      <div>
        <h4>منتج آخر</h4>
        <p>الكمية: 1</p>
      </div>
      <span>25$</span>
    </div>

    <div class="cart-total">
      الإجمالي: 65$
    </div>

    <button>إتمام الشراء</button>
  </div>


  


</body>
</html>
